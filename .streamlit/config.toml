# ============================================================================
# Configuración de Streamlit para MLB Predictor (tema único negro/naranja)
# ============================================================================

[server]
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[theme]
base = "dark"
primaryColor = "#ff6a00"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0f0f0f"
textColor = "#f2f2f2"
# Las fuentes se cargan vía @import en src/assets/theme.css
font = "Manrope, sans-serif"
headingFont = "Big Shoulders Display, sans-serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[runner]
magicEnabled = true
fastReruns = true